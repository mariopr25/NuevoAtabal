---
- name: Desplegar servidor completo (Moodle + Correo + Monitorización)
  hosts: vps
  become: true
  strategy: linear
  vars_files:
    - ../group_vars/all.yml

  roles:
    - letsencrypt                    # Obtener certificados SSL (standalone) ANTES de arrancar Nginx
    - mariadb                        # Instalar MariaDB, configurar rendimiento, crear usuario exporter
    - redis                          # Instalar Redis, configurar maxmemory, política, contraseña, bind localhost
    - nginx-php                      # Instalar Nginx y PHP-FPM, configurar pool Moodle, opcache, status page
    - moodle                         # Descargar Moodle 5.2, crear DB, config.php con Redis, instalación silenciosa
    - mail                           # Postfix (virtual), Dovecot (passwd-file), ClamAV, SpamAssassin, DKIM
    # - monitoring-base                # Fail2ban, RKHunter, Monit
    # - monitoring-prometheus          # Prometheus y exporters (versiones parametrizadas, listen localhost)
    # - monitoring-grafana             # Grafana, datasource vía API REST, dashboards

  post_tasks:
    - name: Generar archivo con registros DNS
      ansible.builtin.template:            # <- FQCN
        src: dns_records.txt.j2
        dest: ./dns_records.txt
        mode: '0644'                       # <- Permisos seguros
      delegate_to: localhost
      run_once: true
      become: false
      tags: dns
      when: dominio_web != "moodle.local"
      # noqa: run-once (se usa con delegate_to para asegurar ejecución única)
